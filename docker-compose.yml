services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wpp_campaigns
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wpp_campaigns"]
      interval: 2s
      timeout: 5s
      retries: 15

  migrate:
    build: .
    image: whatsapp-campaigns-api
    command: ["node", "dist/database/migrate.js"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/wpp_campaigns
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    image: whatsapp-campaigns-api
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/wpp_campaigns
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: .
    image: whatsapp-campaigns-api
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/wpp_campaigns
      FAKE_FAIL_RATE: ${FAKE_FAIL_RATE:-0.2}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 60s

volumes:
  postgres-data:
